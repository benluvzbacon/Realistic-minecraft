plugins { id 'fabric-loom' version "${loom_version}"; id 'maven-publish' }
version = project.mod_version
group = project.group
base { archivesName = project.archives_base_name }
repositories { mavenCentral() }
loom {
 splitEnvironmentSourceSets()
 mods { virtualplanet { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}
dependencies {
 minecraft "com.mojang:minecraft:${project.minecraft_version}"
 mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
 modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
 modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
 testImplementation platform('org.junit:junit-bom:5.10.3'); testImplementation 'org.junit.jupiter:junit-jupiter'
}
processResources { inputs.property 'version', version; filesMatching('fabric.mod.json') { expand version: version } }
tasks.withType(JavaCompile).configureEach { options.release = 21 }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
test { useJUnitPlatform() }
jar { from('LICENSE') { rename { "${it}_${project.archives_base_name}" } } }
